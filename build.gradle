import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar
import com.vanniktech.maven.publish.DeploymentValidation

plugins {
  id 'java-library'
  id "com.vanniktech.maven.publish" version "0.36.0"
  id "org.asciidoctor.jvm.convert" version "4.0.4"
}

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

group 'net.emustudio'
version '12.1.0-SNAPSHOT'

base {
  archivesName = 'emulib'
}

ext.versions = [
        slf4j: '2.0.17'
]

repositories {
  mavenCentral()
}

dependencies {
  def compileOnlyWithTests = { String dependency ->
    compileOnly dependency
    testImplementation dependency
  }

  compileOnlyWithTests("org.slf4j:slf4j-api:${versions.slf4j}")
  compileOnlyWithTests('net.jcip:jcip-annotations:1.0')

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.easymock:easymock:5.6.0'
}

mavenPublishing {
  coordinates("net.emustudio", "emulib", version)
  configure(new JavaLibrary(
          new JavadocJar.Javadoc(),
          new SourcesJar.Sources()
  ))

  signAllPublications()
  publishToMavenCentral(true, DeploymentValidation.PUBLISHED)

  pom {
    name = 'emuLib'
    description = 'Run-time library used by emuStudio and plugins'
    url = 'https://github.com/emustudio/emuLib'
    licenses {
      license {
        name = 'GNU General Public License, Version 3.0'
        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
      }
    }
    developers {
      developer {
        id = 'vbmacher'
        name = 'Peter Jakubčo'
        email = 'pjakubco@gmail.com'
      }
      developer {
        id = 'sulir'
        name = 'Matúš Sulír'
        email = 'matus.sulir@gmail.com'
      }
    }
    scm {
      connection = 'scm:git:git@github.com:emustudio/emuLib.git'
      developerConnection = 'scm:git:git@github.com:emustudio/emuLib.git'
      url = 'https://github.com/emustudio/emuLib'
    }
  }
}

signing {
  required {
    project.gradle.taskGraph.hasTask("publish")
  }

  def signingKey = findProperty("GPG_KEY") ?: System.getenv("GPG_KEY")
  def signingPassword = findProperty("GPG_PASSWORD") ?: System.getenv("GPG_PASSWORD")
  useInMemoryPgpKeys(signingKey, signingPassword)
}

test {
  systemProperty 'java.awt.headless', 'true'
  testLogging {
    events "passed", "skipped", "failed"
  }
}

javadoc {
  options.addStringOption('Xdoclint:all,-missing', '-quiet')
  options.memberLevel = JavadocMemberLevel.PROTECTED
  if (JavaVersion.current().isJava9Compatible()) {
    options.addBooleanOption('html5', true)
  }
}

asciidoctorj {
  modules {
    diagram.use()
  }
}

tasks.register('doc', org.asciidoctor.gradle.jvm.AsciidoctorTask) {
  group = 'documentation'
  description = 'Renders the AsciiDoc documents in docs/ to HTML into docs/output/'

  sourceDir file('docs')
  sources {
    include '*.adoc'
  }
  outputDir file('docs/output')
  baseDirFollowsSourceFile()

  outputOptions {
    backends = ['html5']
    separateOutputDirs = false
  }

  attributes 'source-highlighter': 'rouge',
             'toc'               : 'left',
             'icons'             : 'font',
             'sectanchors'       : '',
             'idprefix'          : '',
             'idseparator'       : '-'
}
